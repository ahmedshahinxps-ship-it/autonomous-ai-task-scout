name: Free Read-Only Task Scout
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scout.py'
      - 'vet.py'
      - 'worker.py'
      - 'examples/**'
      - 'tests/**'
      - '.github/workflows/task-scout.yml'
  schedule:
    - cron: '17 7,13,19 * * *'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Read-only live discovery
        run: python scout.py --output output
      - name: Vet eligible GitHub issue leads (read-only)
        run: python vet.py --input output/opportunities.json --output output --max-checks 12
      - name: Execute synthetic product-catalogue task (no buyer submission)
        run: python worker.py --input examples/sample_products.csv --output output/work_sample
      - name: Upload report artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: daily-opportunity-report
          path: output/
          retention-days: 7
